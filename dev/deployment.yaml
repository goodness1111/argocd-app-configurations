apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-etech
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: 8
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: rudolphnfor/etech
        ports:
        - containerPort: 8080
